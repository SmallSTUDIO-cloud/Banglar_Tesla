name: Verify and Build Android Test APK

on:
  push:
    branches:
      - 'arena/*'
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Verify current features and assemble debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install and verify source
        run: |
          npm ci
          npm run build
          npm test
          npm run test:android-pipeline
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Inspect runner Android SDK and install missing official components
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}; ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          ls -la "$SDK" || true
          ls -la "$SDK/platforms" "$SDK/build-tools" "$SDK/cmdline-tools" || true
          if [ -f "$SDK/platforms/android-34/android.jar" ] && [ -x "$SDK/build-tools/34.0.0/aapt2" ]; then
            echo 'Official SDK Platform 34 and Build Tools 34.0.0 already present'
          elif command -v sdkmanager >/dev/null 2>&1; then
            sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
          else
            echo '::error::Runner lacks Platform 34 or Build Tools 34.0.0 and official sdkmanager is unavailable; cannot build APK'
            exit 1
          fi
      - name: Check toolchain and assemble through the checked-in Gradle pipeline
        run: |
          set -euo pipefail
          if ! python3 scripts/build-apk.py --check > toolchain-check.log 2>&1; then
            cat toolchain-check.log
            while IFS= read -r line; do echo "::error::$line"; done < toolchain-check.log
            exit 1
          fi
          cat toolchain-check.log
          if ! python3 scripts/build-apk.py > gradle-apk.log 2>&1; then
            tail -50 gradle-apk.log
            grep -E 'Android build pipeline:|BUILD FAILED|FAILURE:|Missing|mismatch|Exception|error:' gradle-apk.log | tail -10 | while IFS= read -r line; do echo "::error::$line"; done || true
            exit 1
          fi
          tail -40 gradle-apk.log
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/banglar-tesla-v0.6.7-debug.apk
          sha256sum artifacts/banglar-tesla-v0.6.7-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: banglar-tesla-v0.6.7-debug-apk
          path: artifacts/banglar-tesla-v0.6.7-debug.apk
          if-no-files-found: error
      # A uniquely marked push publishes only after all verification and artifact upload.
      # A debug-signed APK must never be presented as a production-signed release.
      - name: Publish graphics-baseline debug test prerelease
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-bench-apk]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Deliberately NOT a semver release tag: this is a measurement build for
          # the hybrid-graphics hardware gate. versionName stays 0.6.7.
          # Tag names the build so two APKs can never be confused.
          TAG="v0.6.7-test.bench-${GITHUB_SHA:0:7}"
          APK=artifacts/banglar-tesla-v0.6.7-debug.apk
          if gh release view "$TAG" >/dev/null 2>&1 || git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Refusing to overwrite existing tag or release $TAG" >&2
            exit 1
          fi
          SHA="$(sha256sum "$APK" | awk '{print $1}')"
          SIZE="$(stat -c%s "$APK")"
          NOTES="**Debug-signed TEST APK built solely to take the hybrid-graphics hardware measurement. Not a feature or production release.** Package com.shostalab.banglartesla; versionCode 11; versionName 0.6.7; minSdk 24. Built from commit $GITHUB_SHA. APK size: $SIZE bytes. SHA-256: $SHA. Produced by the official Android SDK 34 / Gradle pipeline after unit and web-bundle checks; signature, alignment, identity and bundled assets verified by scripts/build-apk.py. **Build identity:** the main-menu footer shows the short commit SHA next to the version (e.g. v0.6.7 . 72d259d). If your menu shows no SHA, you are running an older APK. **What is new:** the device benchmark (src/core/perfBench.ts) is bundled, and builds now identify themselves. Nothing about rendering, world geometry, materials or gameplay was changed in this build. **How to run the measurement:** open the app, reach the main menu, and tap the version label at the bottom of the menu five times quickly. The benchmark then runs low, balanced and high, and shows a results panel with the real GPU name, frame timing, draw calls, triangles, texture memory and JS heap. Use Copy results to paste them back. It restores your quality setting when finished. **Please report:** the whole results panel text. It prints the actual GPU string, so a run on an emulator or a desktop browser is self-evident and cannot be mistaken for a phone. **Not verified:** performance on any physical Android device. That is the entire purpose of this build; no performance claim is made until the numbers come back. Installing over an older v0.6.7 build may fail because the CI debug key differs - uninstall the previous app first. This is NOT production-signed. The matching web game is deployed separately through the main-branch GitHub Pages workflow."
          gh release create "$TAG" "$APK" --target "$GITHUB_SHA" \
            --prerelease --title 'Banglar Tesla v0.6.7 - device benchmark test APK (graphics baseline)' \
            --notes "$NOTES"
