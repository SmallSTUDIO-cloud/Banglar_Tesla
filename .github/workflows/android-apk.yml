name: Build & Release Android APK

on:
  push:
    branches:
      - 'arena/*'
      - main
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish this verified baseline as a separate GitHub Release'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-apk:
    name: Verify baseline and assemble debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install and verify source
        run: |
          npm ci
          npm run build
          npm test
          npm run test:android-pipeline
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Inspect runner Android SDK and install missing official components
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}; ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          ls -la "$SDK" || true
          ls -la "$SDK/platforms" "$SDK/build-tools" "$SDK/cmdline-tools" || true
          if [ -f "$SDK/platforms/android-34/android.jar" ] && [ -x "$SDK/build-tools/34.0.0/aapt2" ]; then
            echo 'Official SDK Platform 34 and Build Tools 34.0.0 already present'
          elif command -v sdkmanager >/dev/null 2>&1; then
            sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
          else
            echo '::error::Runner lacks Platform 34 or Build Tools 34.0.0 and official sdkmanager is unavailable; cannot build APK'
            exit 1
          fi
      - name: Check toolchain and assemble through the checked-in Gradle pipeline
        run: |
          set -euo pipefail
          if ! python3 scripts/build-apk.py --check > toolchain-check.log 2>&1; then
            cat toolchain-check.log
            while IFS= read -r line; do echo "::error::$line"; done < toolchain-check.log
            exit 1
          fi
          cat toolchain-check.log
          if ! python3 scripts/build-apk.py > gradle-apk.log 2>&1; then
            tail -50 gradle-apk.log
            grep -E 'Android build pipeline:|BUILD FAILED|FAILURE:|Missing|mismatch|Exception|error:' gradle-apk.log | tail -10 | while IFS= read -r line; do echo "::error::$line"; done || true
            exit 1
          fi
          tail -40 gradle-apk.log
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/banglar-tesla-v0.6.0-baseline-debug.apk
          sha256sum artifacts/banglar-tesla-v0.6.0-baseline-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: banglar-tesla-v0.6.0-baseline-debug-apk
          path: artifacts/banglar-tesla-v0.6.0-baseline-debug.apk
          if-no-files-found: error
      - name: Publish separate baseline release (never overwrite v0.6.0)
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=v0.6.0-baseline-20261031
          APK=artifacts/banglar-tesla-v0.6.0-baseline-debug.apk
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing release $TAG" >&2
            exit 1
          fi
          SHA="$(sha256sum "$APK" | awk '{print $1}')"
          SIZE="$(stat -c%s "$APK")"
          gh release create "$TAG" "$APK" --target "$GITHUB_SHA" --latest \
            --title 'Banglar Tesla v0.6.0 — progress baseline (debug APK)' \
            --notes "Debug-signed APK from commit $GITHUB_SHA. Package com.shostalab.banglartesla; versionCode 7; versionName 0.6.0; minSdk 24. File size: $SIZE bytes. SHA-256: $SHA. Built with the repository Gradle 8.7 / AGP 8.5.2 pipeline on JDK 17 and official Android SDK 34 / Build Tools 34.0.0. The build script verifies zip alignment, signing, APK identity/version and the bundled web assets. Gameplay progress is PARTIAL (see docs/DHAKA_FIRST_CONTINUATION_REPORT.md). No installation or physical-device validation has been performed. This is a test APK, not a production-signed update; it may not install over a differently signed copy."
