name: Build & Release Android APK

on:
  push:
    branches:
      - arena/ea8c21f1-banglar-tesla
      - main
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish APK to GitHub Release v0.5.0'
        required: false
        default: 'true'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Debug Android APK (v0.5.0)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies, typecheck, test, and build web bundle
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build & sign Android APK with Android SDK tools
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BUILD_TOOLS="$(ls -d "$SDK_ROOT"/build-tools/* | sort -V | tail -n 1)"
          PLATFORM_JAR="$(ls "$SDK_ROOT"/platforms/android-*/android.jar | sort -V | tail -n 1)"
          echo "Using BUILD_TOOLS=$BUILD_TOOLS"
          echo "Using PLATFORM_JAR=$PLATFORM_JAR"

          WORK_DIR="$(mktemp -d)"
          mkdir -p "$WORK_DIR/classes" "$WORK_DIR/dex" android/app/src/main/assets/public artifacts
          rm -rf android/app/src/main/assets/public/*
          cp -r dist/* android/app/src/main/assets/public/
          find android/app/src/main/assets/public -name ".*" -type f -delete

          # 1. Compile resources & link manifest + offline web & audio assets
          "$BUILD_TOOLS/aapt2" compile --dir android/app/src/main/res -o "$WORK_DIR/res.zip"
          "$BUILD_TOOLS/aapt2" link \
            -o "$WORK_DIR/unaligned.apk" \
            -I "$PLATFORM_JAR" \
            --manifest android/app/src/main/AndroidManifest.xml \
            -A android/app/src/main/assets \
            --java "$WORK_DIR/gen" \
            --min-sdk-version 24 \
            --target-sdk-version 34 \
            --version-code 5 \
            --version-name 0.5.0 \
            -0 .ttf -0 .png -0 .jpg -0 .webp -0 .mp3 -0 .ogg -0 .wav \
            --auto-add-overlay \
            "$WORK_DIR/res.zip"

          # 2. Compile Java sources (including BanglaTtsBridge) -> DEX
          find android/app/src/main/java "$WORK_DIR/gen" -name "*.java" > "$WORK_DIR/sources.txt"
          javac --release 11 -classpath "$PLATFORM_JAR" -d "$WORK_DIR/classes" @"$WORK_DIR/sources.txt"
          find "$WORK_DIR/classes" -name "*.class" > "$WORK_DIR/classes.txt"
          "$BUILD_TOOLS/d8" --min-api 24 --lib "$PLATFORM_JAR" --output "$WORK_DIR/dex" @"$WORK_DIR/classes.txt"

          # 3. Package classes.dex, zipalign (4-byte), and debug-sign (v1+v2+v3)
          cp "$WORK_DIR/dex/classes.dex" "$WORK_DIR/classes.dex"
          (cd "$WORK_DIR" && zip -q -9 unaligned.apk classes.dex)
          "$BUILD_TOOLS/zipalign" -f -p 4 "$WORK_DIR/unaligned.apk" "$WORK_DIR/aligned.apk"

          KEYSTORE="$WORK_DIR/debug.keystore"
          keytool -genkeypair -keystore "$KEYSTORE" -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10950 \
            -dname "CN=Android Debug,O=Android,C=US"

          OUT_APK="artifacts/banglar-tesla-v0.5.0-debug.apk"
          STABLE_APK="artifacts/Banglar-Tesla.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$OUT_APK" \
            "$WORK_DIR/aligned.apk"

          cp "$OUT_APK" "$STABLE_APK"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$OUT_APK"
          "$BUILD_TOOLS/aapt2" dump badging "$OUT_APK"
          ls -lh "$OUT_APK" "$STABLE_APK"

      - name: Upload APK build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: banglar-tesla-v0.5.0-android-apk
          path: |
            artifacts/banglar-tesla-v0.5.0-debug.apk
            artifacts/Banglar-Tesla.apk
          if-no-files-found: error

      - name: Publish APK assets to GitHub Release v0.5.0
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release-v0.5.0]')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v0.5.0"
          APK="artifacts/banglar-tesla-v0.5.0-debug.apk"
          STABLE="artifacts/Banglar-Tesla.apk"
          SHA="$(sha256sum "$APK" | awk '{print $1}')"
          SIZE="$(stat -c%s "$APK")"
          NOTES=$(cat <<EOF
          ## Banglar Tesla — বাংলার টেসলা (\`v0.5.0\`)

          Major arcade street-progression, physics & OBB hitbox overhaul, hold-to-boost \`টার্বো\`, **Rickshaw Blacklist (#10 → #1)**, **5-Heat Police Pursuit & Roadblocks**, **Dynamic In-Game Clock**, and authentic Bengali speech upgrade for **Banglar Tesla**, built Android-first and verified against the \`v0.4.0\` performance baseline on **Samsung Galaxy M21** (\`Exynos 9611 / Mali-G72 MP3\`) budgets.

          ### What's New in \`v0.5.0\`
          - **Calibrated Rickshaw Physics & Tight OBB Hitboxes:** Overhauled 60 Hz cycle/electric rickshaw handling (~20 km/h classic cruise, ~39 km/h \`টান\` boost, speed-sensitive steering, separate longitudinal/lateral grip, progressive braking, weight transfer, slope grounding) and exact 2-circle capsule vs rotated OBB colliders for buildings, props, traffic, rivals, police SUVs, and roadblocks — zero phantom air hits and zero \`0 km/h\` stuck soft-locks.
          - **Hold-to-Boost \`টার্বো\` + Exaggerated Arcade VFX:** Distinct hold-only \`টার্বো\` boost (~60 km/h peak, instant stop on release/pause/menu/empty, auto-recharge + near-miss/clean-driving/checkpoint/escape rewards), pooled twin rear exhaust flames, camera acceleration lag & FOV surge, and fast-recovery tiered crash bursts (\`minor\` / \`medium\` / \`major\`).
          - **Rickshaw Blacklist (#10 → #1), Skippable Intro Cinematic & 7 Event Types:** Original Mohammadpur rival roster (#10 → #1), once-only skippable 18s first-entry intro cinematic, 7 street event types (street race, sprint, circuit, time trial, checkpoint rush, traffic weave, pursuit escape), REP + টাকা progression, \`turboCap\`/\`turboRecharge\` upgrades, and \`v0.4.0 → v0.5.0\` save migration.
          - **5-Heat Police Pursuit & Smashable Roadblocks:** Serious 5-Heat police chase FSM (pursuit, line-of-sight break, cooldown, evade, bust), narrow-\`gali\` rickshaw maneuverability advantage, and pooled road-graph-aware roadblocks with guaranteed rickshaw gaps and smashable sawhorse barricades.
          - **Dynamic In-Game Time System & Authentic Bangla Speech:** Accelerated 24-hour HUD clock (\`07:30 AM\` / \`06:45 PM\` in both Bangla & English modes, synced with \`morning\`/\`noon\`/\`golden\`/\`blue\`/\`night\`, paused in menus/modals, persisted in saves, zero per-frame DOM churn) and strict Bengali voice verification (\`bn-BD\`/\`bn-IN\`/\`bn\`) with intelligible offline phonetic WAV fallback (26 bundled \`.wav\` assets, \`3.08 MB\` total).

          ### APK Details
          - **Direct Download (Stable Latest URL):** \`Banglar-Tesla.apk\` (\`$SIZE\` bytes)
          - **Versioned Asset:** \`banglar-tesla-v0.5.0-debug.apk\` (\`$SIZE\` bytes)
          - **App Name:** \`Banglar Tesla\`
          - **Application ID:** \`com.shostalab.banglartesla\`
          - **Version:** \`0.5.0\` (\`versionCode: 5\`)
          - **Android Compatibility:** Android 7.0+ (\`minSdkVersion 24\`, \`targetSdkVersion 34\`)
          - **Permissions Requested:** None (\`0\` \`<uses-permission>\` entries; runs 100% offline)
          - **Signing:** Android debug signature (\`APK Signature Scheme v1 + v2 + v3\`)
          - **SHA-256:** \`$SHA\`
          EOF
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$STABLE" --clobber
            gh release edit "$TAG" --latest --title "Banglar Tesla v0.5.0 — Rickshaw Blacklist, Hold-to-Boost টার্বো, Police Pursuit & Dynamic Time" --notes "$NOTES"
          else
            gh release create "$TAG" "$APK" "$STABLE" \
              --latest \
              --target "${{ github.sha }}" \
              --title "Banglar Tesla v0.5.0 — Rickshaw Blacklist, Hold-to-Boost টার্বো, Police Pursuit & Dynamic Time" \
              --notes "$NOTES"
          fi
