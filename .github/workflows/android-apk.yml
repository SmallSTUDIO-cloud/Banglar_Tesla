name: Build & Release Android APK

on:
  push:
    branches:
      - 'arena/*'
      - main
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish APK to GitHub Release v0.5.1'
        required: false
        default: 'true'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Debug Android APK (v0.5.1)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies, typecheck, test, and build web bundle
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build & sign Android APK with Android SDK tools
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BUILD_TOOLS="$(ls -d "$SDK_ROOT"/build-tools/* | sort -V | tail -n 1)"
          PLATFORM_JAR="$(ls "$SDK_ROOT"/platforms/android-*/android.jar | sort -V | tail -n 1)"
          echo "Using BUILD_TOOLS=$BUILD_TOOLS"
          echo "Using PLATFORM_JAR=$PLATFORM_JAR"

          WORK_DIR="$(mktemp -d)"
          mkdir -p "$WORK_DIR/classes" "$WORK_DIR/dex" android/app/src/main/assets/public artifacts
          rm -rf android/app/src/main/assets/public/*
          cp -r dist/* android/app/src/main/assets/public/
          find android/app/src/main/assets/public -name ".*" -type f -delete

          # 1. Compile resources & link manifest + offline web & audio assets
          "$BUILD_TOOLS/aapt2" compile --dir android/app/src/main/res -o "$WORK_DIR/res.zip"
          "$BUILD_TOOLS/aapt2" link \
            -o "$WORK_DIR/unaligned.apk" \
            -I "$PLATFORM_JAR" \
            --manifest android/app/src/main/AndroidManifest.xml \
            -A android/app/src/main/assets \
            --java "$WORK_DIR/gen" \
            --min-sdk-version 24 \
            --target-sdk-version 34 \
            --version-code 6 \
            --version-name 0.5.1 \
            -0 .ttf -0 .png -0 .jpg -0 .webp -0 .mp3 -0 .ogg -0 .wav \
            --auto-add-overlay \
            "$WORK_DIR/res.zip"

          # 2. Compile Java sources (including BanglaTtsBridge) -> DEX
          find android/app/src/main/java "$WORK_DIR/gen" -name "*.java" > "$WORK_DIR/sources.txt"
          javac --release 11 -classpath "$PLATFORM_JAR" -d "$WORK_DIR/classes" @"$WORK_DIR/sources.txt"
          find "$WORK_DIR/classes" -name "*.class" > "$WORK_DIR/classes.txt"
          "$BUILD_TOOLS/d8" --min-api 24 --lib "$PLATFORM_JAR" --output "$WORK_DIR/dex" @"$WORK_DIR/classes.txt"

          # 3. Package classes.dex, zipalign (4-byte), and debug-sign (v1+v2+v3)
          cp "$WORK_DIR/dex/classes.dex" "$WORK_DIR/classes.dex"
          (cd "$WORK_DIR" && zip -q -9 unaligned.apk classes.dex)
          "$BUILD_TOOLS/zipalign" -f -p 4 "$WORK_DIR/unaligned.apk" "$WORK_DIR/aligned.apk"

          KEYSTORE="$WORK_DIR/debug.keystore"
          keytool -genkeypair -keystore "$KEYSTORE" -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10950 \
            -dname "CN=Android Debug,O=Android,C=US"

          OUT_APK="artifacts/banglar-tesla-v0.5.1-debug.apk"
          STABLE_APK="artifacts/Banglar-Tesla.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$OUT_APK" \
            "$WORK_DIR/aligned.apk"

          cp "$OUT_APK" "$STABLE_APK"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$OUT_APK"
          "$BUILD_TOOLS/aapt2" dump badging "$OUT_APK"
          ls -lh "$OUT_APK" "$STABLE_APK"

      - name: Upload APK build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: banglar-tesla-v0.5.1-android-apk
          path: |
            artifacts/banglar-tesla-v0.5.1-debug.apk
            artifacts/Banglar-Tesla.apk
          if-no-files-found: error

      - name: Publish APK assets to GitHub Release v0.5.1
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release-v0.5.1]')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v0.5.1"
          APK="artifacts/banglar-tesla-v0.5.1-debug.apk"
          STABLE="artifacts/Banglar-Tesla.apk"
          SHA="$(sha256sum "$APK" | awk '{print $1}')"
          SIZE="$(stat -c%s "$APK")"
          NOTES=$(cat <<EOF
          ## Banglar Tesla — বাংলার টেসলা (\`v0.5.1\`)

          The **Master Upgrade v4** release: purpose-built Mohammadpur **Race-Map design**, full **4-Rickshaw Race mode** (you + 3 distinct AI rivals), **Printed-Photo Winner Snapshot**, visible rival-driver characters, per-rival skippable intro cinematics, NPC & world graphics quality passes, and a **Web/PC High** quality profile — on top of every \`v0.5.0\` system (physics, \`টার্বো\`, Blacklist #10→#1, 5-Heat Police Pursuit, Dynamic Clock, authentic Bengali speech).

          ### What's New in \`v0.5.1\`
          - **Purpose-Built Race-Map Courses:** 17 validated Mohammadpur race blueprints (sprints, 2-lap circuits incl. Tajmahal–Shia Mosque & Asad Gate Grand Circuit) authored over the real OSM road graph — clear start/finish gantry, readable racing lines, wide overtaking/Turbo straights, tight \`gali\` corners, Box-Culvert/Overpass elevation crests (Beribadh, Ring Rd Shia Mosque overpass, Babar Rd canal bridge, Satmasjid culvert), and documented high-risk shortcuts (Kacha Bazar back-alley, Krishi Market diagonal, Aziz Moholla, Lalmatia cut, Chanmia bypass, Johuri chicane) that measurably save distance. Every course auto-validates grid clearance, carriageway bounds, gate reachability and AI waypoints.
          - **4-Rickshaw Race Mode:** Exactly 3 distinct AI rivals + you on a collision-free staggered 2x2 grid under a Dhaka bamboo festoon arch — data-driven rivals with complementary tendencies (\`clean_line\` / \`aggressive_overtaker\` / \`shortcut_seeker\`), traffic- & roadblock-aware overtaking without teleporting, checkpoint/lap-based \`1/4\`-\`4/4\` standings HUD, safe course respawning, single-fire rewards, and clean pause/retry/quit handling.
          - **Printed-Photo Winner Snapshot (Victory Only):** Original scrapbook-style photo frame (paper border, tape marks, Dhaka stamp) around the live 3D winning rickshaw with the driver's celebratory raised-fist pose, finish time, top speed, টাকা/REP rewards and full 4-racer final standings — with Continue / Race Again / Free Roam actions. Defeats use a separate non-photo results screen.
          - **Visible Rival Characters & Per-Rival Cinematics:** All 10 Blacklist rivals now ride with recognizable drivers (expressive faces, eyes/brows/mouth, 10 distinct hair/headwear silhouettes, eyewear, 6 outfit styles, articulated arms/hands gripping the handlebar, animated pedal legs), crisp inline-SVG profile portraits in the Blacklist roster, and a skippable 6.5s per-rival character intro with voiced Bangla/English taunt.
          - **NPC & World Graphics Quality Pass:** Pedestrians rebuilt with visible faces, hair/topi/orna silhouettes, swinging arms with attached hands, legs & sandals (9 shared instanced draw calls, LOD-throttled AI); traffic fleet resculpted (bus/truck/van/sedan/CNG/easybike/motorbike silhouettes, cabin drivers, plates, wheel wells); building facades gained floor-slab stringcourses, side windows with sunshades, shop pilasters, balcony sliding doors/planters, foundation plinths & gate pillars; sparse non-collidable instanced street litter (136 scraps, 1 draw call, wind-reactive) with zero collision impact.
          - **Quality Profiles:** \`Performance\` / \`Balanced\` / \`High\` / \`Web/PC High\` presets (shadows, crowd, traffic, draw distance, texture quality) without ever forcing Low or altering physics/collisions.

          All \`v0.5.0\` systems are included: calibrated ~20 km/h classic / ~39 km/h \`টান\` / ~60 km/h hold-to-boost \`টার্বো\` physics, tight OBB hitboxes, 5-Heat Police Pursuit & smashable roadblocks, Dynamic In-Game Clock (\`07:30 AM\` / \`06:45 PM\`), authentic Bengali speech (\`bn-BD\`/\`bn-IN\`/\`bn\` + 26 offline WAVs), REP + টাকা economy, and \`v0.4.0\`+ save migration.

          ### APK Details
          - **Direct Download (Stable Latest URL):** \`Banglar-Tesla.apk\` (\`$SIZE\` bytes)
          - **Versioned Asset:** \`banglar-tesla-v0.5.1-debug.apk\` (\`$SIZE\` bytes)
          - **App Name:** \`Banglar Tesla\`
          - **Application ID:** \`com.shostalab.banglartesla\`
          - **Version:** \`0.5.1\` (\`versionCode: 6\`)
          - **Android Compatibility:** Android 7.0+ (\`minSdkVersion 24\`, \`targetSdkVersion 34\`)
          - **Permissions Requested:** None (\`0\` \`<uses-permission>\` entries; runs 100% offline)
          - **Signing:** Android debug signature (\`APK Signature Scheme v1 + v2 + v3\`)
          - **SHA-256:** \`$SHA\`
          EOF
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$STABLE" --clobber
            gh release edit "$TAG" --latest --title "Banglar Tesla v0.5.1 — 4-Rickshaw Race, Race-Map Design & Winner Snapshot" --notes "$NOTES"
          else
            gh release create "$TAG" "$APK" "$STABLE" \
              --latest \
              --target "${{ github.sha }}" \
              --title "Banglar Tesla v0.5.1 — 4-Rickshaw Race, Race-Map Design & Winner Snapshot" \
              --notes "$NOTES"
          fi
