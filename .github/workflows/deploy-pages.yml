name: Deploy Web Game to GitHub Pages

on:
  push:
    branches:
      - arena/7873a750-banglar-tesla
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    name: Build & Verify Web Bundle
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.pages_check.outputs.enabled }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck & unit tests
        run: |
          npm run typecheck
          npm test

      - name: Build baseline bundle & run E2E / Mobile / Spec suites
        run: |
          npm run build
          npm run test:e2e
          npm run test:mobile
          npm run test:spec

      - name: Build production GitHub Pages bundle (/Banglar_Tesla/)
        env:
          GITHUB_PAGES: 'true'
        run: |
          npm run build
          test -f dist/index.html
          test -f dist/.nojekyll
          grep -q '/Banglar_Tesla/assets/' dist/index.html
          ! grep -q 'url(/fonts/' dist/assets/*.css

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Check if GitHub Pages is enabled in repository settings
        id: pages_check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            {
              echo "### GitHub Pages Repository Setting Required"
              echo "Web bundle built, verified, and uploaded as \`github-pages\` artifact."
              echo "To publish live at \`https://smallstudio-cloud.github.io/Banglar_Tesla/\`:"
              echo "1. Open **Settings → Pages** in \`${{ github.repository }}\`."
              echo "2. Under **Build and deployment → Source**, select **GitHub Actions**."
              echo "3. Re-run this workflow (or push/merge to \`main\`)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: needs.build.outputs.pages_enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
