plugins {
    id 'com.android.application'
}

android {
    namespace 'com.shostalab.banglartesla'
    compileSdk 34

    defaultConfig {
        applicationId "com.shostalab.banglartesla"
        minSdk 24
        targetSdk 34
        versionCode 6
        versionName "0.5.1"
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

tasks.register('syncWebDist', Copy) {
    from '../../dist'
    into 'src/main/assets/public'
}

preBuild.dependsOn(syncWebDist)
