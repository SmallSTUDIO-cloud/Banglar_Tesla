plugins {
    id 'com.android.application'
}

android {
    namespace 'com.shostalab.banglartesla'
    compileSdk 34

    defaultConfig {
        applicationId "com.shostalab.banglartesla"
        minSdk 24
        targetSdk 34
        versionCode 7
        versionName "0.6.0"
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

// Offline WebView assets are the exact current Vite bundle. Sync removes stale
// hashed JS/CSS files from a previous build rather than accumulating them.
tasks.register('syncWebDist', Sync) {
    from rootProject.file('../dist')
    into 'src/main/assets/public'
    doFirst {
        if (!rootProject.file('../dist/index.html').isFile()) {
            throw new GradleException('Missing dist/index.html — run npm run build first')
        }
    }
}

tasks.named('preBuild').configure { dependsOn tasks.named('syncWebDist') }
